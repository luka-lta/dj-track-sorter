appId: com.lukalta.djtracksorter
productName: DJ Track Sorter
directories:
  output: dist
files:
  - main/**/*
  - src/**/*
  - package.json
extraResources:
  - from: resources/sidecar
    to: sidecar
mac:
  target: dmg
  category: public.app-category.music
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  target: nsis
